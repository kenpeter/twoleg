[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "twoleg-training"
version = "0.1.0"
description = "RL training for the TwoLeg biped, built on mjlab (MuJoCo Warp + rsl_rl)"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "mjlab==1.3.0",
    # mjlab imports scipy but does not declare it.
    "scipy>=1.16",
    "tensorboard>=2.20.0",
]

[project.entry-points."mjlab.tasks"]
twoleg = "twoleg_training.tasks"

[tool.uv]
# bam pins protobuf<4.0 which cascades onnx to a version with no wheels; keep
# protobuf modern. Mirrors microduck_rl.
override-dependencies = [
    "protobuf>=4.0,<7.0",
]
